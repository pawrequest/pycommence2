[project]
name = "pycommence2"
version = "0.5.0"
description = "Clean Python library for Commence database CRUD & schema introspection via COM automation."
readme = "README.md"
license = "MIT"
authors = [
    { name = "paw", email = "pawrequest@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pywin32>=306",
    "platformdirs>=4.0",
    "pydantic-settings>=2.13.1",
]

[project.urls]
Homepage = "https://github.com/pawrequest/pycommence"
Documentation = "https://pawrequest.github.io/pycommence/"
Repository = "https://github.com/pawrequest/pycommence"
Changelog = "https://github.com/pawrequest/pycommence/blob/main/CHANGELOG.md"

[project.optional-dependencies]
cli = ["click>=8.0", "rich>=13.0"]
export = ["openpyxl>=3.1"]
gui = ["nicegui>=2.0", "pywebview>=5.0"]
mcp = ["mcp>=1.0", "fastmcp>=3.2.3"]
dev = ["pytest>=8.0", "pytest-asyncio>=1.0", "ruff>=0.4"]
docs = ["mkdocs-material>=9.0", "mkdocstrings[python]>=0.25"]

[project.scripts]
pycommence = "pycommence.cli:cli"
pycommence-mcp = "pycommence.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"
